# Give the brew payload's first-boot unit its own /tmp.
#
# `brew-setup.service` arrives inside the aurora-dx base image, which carries the
# `ublue-os/brew` payload, so this repository does not write it and cannot review it
# at any revision. What it does in the published image is stage the Homebrew tarball
# through one fixed path, as root:
#
#   ExecStart=/usr/bin/mkdir -p /tmp/homebrew
#   ExecStart=/usr/bin/tar --zstd -xf /usr/share/homebrew.tar.zst -C /tmp/homebrew
#   ExecStart=/usr/bin/cp -R -n /tmp/homebrew/home/linuxbrew/.linuxbrew /home/linuxbrew
#   ExecStart=/usr/bin/chown -R 1000:1000 /home/linuxbrew
#
# On a booted system /tmp is a world-writable tmpfs, and `mkdir -p` exits 0 on an
# existing symlink rather than replacing it. So an account that creates /tmp/homebrew
# first has root extract through its symlink, has whatever extra files it left there
# copied into /home/linuxbrew, and has them handed to UID 1000 by the chown. The prefix
# is what brew-update.timer runs as UID 1000 after boot, and what
# /etc/profile.d/brew-path.sh puts on its owner's PATH.
#
# PrivateTmp mounts a private /tmp and /var/tmp for this unit -- shared by every
# ExecStart= of one invocation, and by no other process on the system -- so the staging
# path stops being a name another account can claim. The copy destination
# (/home/linuxbrew) is outside both, so the payload still lands where it should.
[Service]
PrivateTmp=yes
