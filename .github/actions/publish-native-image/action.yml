name: Publish Native Image

description: Push one locally built image tag to GitHub Container Registry (GHCR) and sign it.

inputs:
  image_registry:
    description: Registry path, for example ghcr.io/danathar.
    required: true
  image_name:
    description: Image name under the registry owner path.
    required: true
  image_tag:
    description: Image tag to push and sign.
    required: true
  registry_username:
    description: Registry username.
    required: true
  registry_password:
    description: Registry password or token.
    required: true
  image_org:
    description: Lowercase registry owner used for signing lookups.
    required: true
  cosign_private_key:
    description: >-
      Private signing key used to sign the pushed image digest. Optional only
      because the branch workflow legitimately omits it (see allow_unsigned);
      every production caller must pass it, and omitting it without
      allow_unsigned fails the publication. GitHub does not actually enforce
      `required:` on action inputs -- an omitted input silently becomes an
      empty string -- so the guard step below, not this field, is what protects
      the production path.
    required: false
    default: ""
  allow_unsigned:
    description: >-
      Explicit opt-in to publish without a signature when no signing key is
      available. Only the branch workflow passes this, for throwaway `br-*`
      test images: the production signing key is scoped to an environment that
      branch refs cannot reach, and unsigned branch images are usable only on
      fresh, never-enforced test VMs -- any machine enforcing this repo's
      signature policy refuses to pull them. Production paths must never set
      this; a workflow test asserts build.yml does not.
    required: false
    default: "false"

runs:
  # This action owns the publication sequence: authenticate, push a transient
  # tag, sign its digest, then promote that same digest to the requested tag.
  # That keeps user-facing tags from pointing at unsigned content -- with one
  # explicit exception: `allow_unsigned` (branch test images only, see the
  # input description). When that exception is active and no key is present,
  # the signing step is skipped and the tag is promoted unsigned.
  using: composite
  steps:
    # Fail-closed default: no key and no explicit opt-in means no push at all.
    - name: Require signing key before publication
      if: inputs.cosign_private_key == '' && inputs.allow_unsigned != 'true'
      shell: bash
      run: |
        echo "SIGNING_SECRET is not available and allow_unsigned is not set. Refusing to publish an unsigned image." >&2
        exit 1

    - name: Warn that this publication is unsigned
      if: inputs.cosign_private_key == '' && inputs.allow_unsigned == 'true'
      shell: bash
      run: |
        echo "::warning::Publishing WITHOUT a cosign signature (allow_unsigned=true, no key available). This image is a throwaway test artifact: machines enforcing this repository's signature policy will refuse to pull it, and it must never be promoted or switched to durably."

    # The `podman push` below authenticates from its own per-command auth file,
    # but the later `skopeo copy`/`skopeo inspect` calls in this file do not pass
    # credentials at all -- they rely on this login's Docker config file via
    # containers/image's fallback lookup. Authenticate here so those calls can
    # talk to GHCR as the current workflow actor.
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ inputs.registry_username }}
        password: ${{ inputs.registry_password }}

    - name: Retag local image for transient publication
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image_name }}
        IMAGE_TAG: ${{ inputs.image_tag }}
        TRANSIENT_IMAGE_TAG: ${{ inputs.image_tag }}-unsigned-${{ github.run_id }}
      run: |
        buildah tag "${IMAGE_NAME}:${IMAGE_TAG}" "${IMAGE_NAME}:${TRANSIENT_IMAGE_TAG}"

    # Push a non-publishable transient tag first. The requested tag is only
    # moved after cosign verifies the digest that will be promoted.
    #
    # Calls `podman push` directly rather than through a wrapper action:
    # redhat-actions/push-to-registry hasn't cut a release since March 2024
    # (though the repo itself is still active), and buildah/podman share the
    # same local container storage, so a plain `podman push` of the tag
    # buildah just built and the previous step retagged works the same way.
    #
    # The credential reaches podman in a `0600` auth file, never as `--creds`:
    # `/proc/<pid>/cmdline` is mode 0444, so a token in argv is readable by every
    # uid on the runner for as long as the push runs. That is what gotcha 6 in
    # `docs/signing-and-bootc.md` prohibits, and this is the same file hand-off
    # `ci_tools/common.py`'s `registry_auth_dir` performs for skopeo and cosign.
    #
    # The file is named explicitly with `--authfile` rather than leaning on
    # podman's own fallback to the `docker/login-action` Docker config above,
    # which would authenticate today but would also turn a login that quietly
    # stopped working into an anonymous push instead of a denied one. Passing the
    # credential keeps the failure mode this step already had. That login is
    # still needed for the later skopeo calls in this file, which read it via the
    # containers/image library's fallback to the Docker config file.
    - name: Push transient tag with podman
      shell: bash
      env:
        IMAGE_REGISTRY: ${{ inputs.image_registry }}
        IMAGE_NAME: ${{ inputs.image_name }}
        TRANSIENT_IMAGE_TAG: ${{ inputs.image_tag }}-unsigned-${{ github.run_id }}
        REGISTRY_USER: ${{ inputs.registry_username }}
        REGISTRY_PASSWORD: ${{ inputs.registry_password }}
      run: |
        set -euo pipefail
        # umask before the file exists rather than chmod after it does: the token
        # must never sit on disk under the default umask, not even for the
        # instant between the two calls.
        umask 077
        auth_dir="$(mktemp -d)"
        trap 'rm -rf "${auth_dir}"' EXIT
        auth_file="${auth_dir}/config.json"
        # `printf` is a bash builtin and `base64` reads the pair on stdin, so the
        # credential never becomes argv of anything, here or in podman. The
        # encode lands in a variable first so that `set -e` sees a failure here:
        # inlined in printf's arguments, a failed substitution would write an
        # empty credential and push on.
        encoded_credential="$(printf '%s' "${REGISTRY_USER}:${REGISTRY_PASSWORD}" | base64 -w0)"
        printf '{"auths":{"%s":{"auth":"%s"}}}\n' \
          "${IMAGE_REGISTRY%%/*}" \
          "${encoded_credential}" \
          > "${auth_file}"
        podman push \
          --tls-verify=true \
          --authfile "${auth_file}" \
          "${IMAGE_NAME}:${TRANSIENT_IMAGE_TAG}" \
          "${IMAGE_REGISTRY}/${IMAGE_NAME}:${TRANSIENT_IMAGE_TAG}"

    # Install signing tools for the mandatory post-push signature.
    - uses: ./.github/actions/install-signing-tools

    # Sign the pushed image by digest, not by a mutable tag name. A tag such as
    # `latest` can move later, but a digest names one exact image forever.
    # Signing relies on the registry login performed above, not on separate
    # credentials passed into sign-image.
    # Skipped only in the explicit unsigned-branch case. When a key IS present
    # the image is signed even if allow_unsigned was passed, so the opt-in can
    # never downgrade a run that is able to sign.
    - name: Sign transient image digest
      if: inputs.cosign_private_key != ''
      shell: bash
      env:
        IMAGE_ORG: ${{ inputs.image_org }}
        IMAGE_NAME: ${{ inputs.image_name }}
        IMAGE_TAG: ${{ inputs.image_tag }}-unsigned-${{ github.run_id }}
        COSIGN_PRIVATE_KEY: ${{ inputs.cosign_private_key }}
      run: |
        python3 -m ci_tools.cli sign-image

    - name: Promote pushed digest to requested tag
      shell: bash
      env:
        IMAGE_REGISTRY: ${{ inputs.image_registry }}
        IMAGE_NAME: ${{ inputs.image_name }}
        IMAGE_TAG: ${{ inputs.image_tag }}
        TRANSIENT_IMAGE_TAG: ${{ inputs.image_tag }}-unsigned-${{ github.run_id }}
      run: |
        transient_ref="docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${TRANSIENT_IMAGE_TAG}"
        transient_digest="$(skopeo inspect --format '{{ .Digest }}' "${transient_ref}")"
        signed_ref="docker://${IMAGE_REGISTRY}/${IMAGE_NAME}@${transient_digest}"
        final_ref="docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
        # --preserve-digests keeps this copy byte-identical rather than
        # letting skopeo re-encode the manifest; a re-encode would be
        # invisible here (the digest check below only compares tags this
        # same job pushed) but would silently drop Chunkah's layer
        # annotations, which is the entire point of rechunking.
        skopeo copy --multi-arch=all --preserve-digests "${signed_ref}" "${final_ref}"
        final_digest="$(skopeo inspect --format '{{ .Digest }}' "${final_ref}")"
        if [ "${final_digest}" != "${transient_digest}" ]; then
          echo "Promoted tag digest ${final_digest} does not match signed digest ${transient_digest}" >&2
          exit 1
        fi
