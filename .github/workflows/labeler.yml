---
name: Labeler

# Applies the descriptive `area/*` labels defined in .github/labeler.yml, so a
# pull request says at a glance which part of the repository it lands in -- and,
# by extension, which risk tier it takes (docs/risk-tiers.md).
#
# `area/safety-critical` is the one that earns this workflow its place. It marks
# a change to one of the seven files CLAUDE.md section 0 rule 2 names, which is
# the trigger for the statement CONTRIBUTING requires and docs/review-rubric.md
# treats as blocking if missing. A reviewer should learn that from the pull
# request, not from reading the diff carefully enough to notice.
#
# Three deliberate choices:
#
# `pull_request`, not `pull_request_target`. This workflow used
# `pull_request_target` until GitHub changed the rules: from 2026-12-02 it stops
# running `pull_request_target` workflows in public repositories unless a
# repository "event policy" allows them
# (https://github.blog/changelog/2026-11-02-pull_request_target-blocked-by-default-december-2).
# The hive's GitHub App cannot create those policies -- the App's owner refused
# it the Administration permission that would take, for security reasons -- so
# keeping `pull_request_target` would mean a hand-made policy per repository.
# The labeler never needed it: it only reads the changed-file list through the
# API. Under `pull_request`, a pull request from a branch in this repository
# gets a write token as long as `permissions:` below grants
# `pull-requests: write`. That covers Dependabot too: its runs start read-only,
# but GitHub's Dependabot docs ("Changing GITHUB_TOKEN permissions") say the
# `permissions` key can raise that.
#
# Pull requests from forks are skipped. Their `pull_request` token is read-only,
# so labelling would fail; the job-level `if:` turns that red run into a grey
# "skipped" one. None of the last 100 pull requests came from a fork, so this
# costs nothing in practice. A fork pull request arrives unlabelled, and a
# reviewer has to read its tier from the diff.
#
# Under `pull_request` the action reads .github/labeler.yml from the pull
# request's own merge commit, not from main, so a pull request can edit the
# globs and be labelled by its own copy -- for instance to dodge
# `area/safety-critical`. That is acceptable here: only same-repository
# branches run, and their authors already have write access. The edit shows in
# the diff under `area/ci` (.github/labeler.yml is not itself safety-critical or
# code-owned), and the required "Python Unit Tests" check fails a pull request
# that drops a Tier 3 path from the safety-critical globs without also editing
# docs/risk-tiers.md and the code-owned CODEOWNERS
# (tests/test_labeler_config.py, tests/test_codeowners.py). CODEOWNERS still
# holds the Tier 3 files themselves for any author but the owner, whatever the
# labels say.
#
# This job never checks out or executes the pull request's code. Do not add a
# checkout of the head ref, or any step that runs code from the pull request,
# while this job holds a write token: that hands the token to code nobody has
# reviewed yet (a dependency a bot bumped, say), and to a fork's code too if the
# trigger ever goes back to `pull_request_target`.
#
# `sync-labels: false` so the action only ever adds. A label a human attached by
# hand is not removed because no path matches it any more.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply area labels
    # Fork pull requests get a read-only token; skip rather than fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Apply labels from .github/labeler.yml
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false
