---
name: Boot test

# Boots the published image in a VM once a day and checks, over SSH, that ZFS
# is installed and its kernel module loaded at boot.
#
# Every other check here reads the image as files. build.yml proves the ZFS
# packages and module files are in the image, and nightly-compliance.yml that
# `:latest` still verifies; neither boots it. ci_tools/boot_test.py does the
# work; this file only gives it a runner with KVM, a VM stack and disk space.
#
# It reports; it gates nothing. It runs after build.yml has already moved
# `:latest`, so a red run here means the image a user would pull right now
# failed. auto-issues.yml turns a red scheduled run into an issue.

on:
  schedule:
    # 08:23 UTC daily: build.yml is scheduled at 06:00 and its recent scheduled
    # runs started by 06:30; a full build has taken at most about 40 minutes,
    # so this boots that morning's `:latest`. An odd minute, clear of the
    # top-of-hour rush when scheduled runs are delayed.
    - cron: "23 08 * * *"
  workflow_dispatch:
    inputs:
      image:
        description: "Image to boot, by tag or digest. Empty boots :latest."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  boot:
    name: boot
    # 26.04 ships podman 5 and a QEMU and virtiofsd new enough for bcvk.
    runs-on: ubuntu-26.04
    # zfs-kinoite-complex's first hosted run of the same job took four minutes
    # with one boot. Each of the at most two boots is bounded at fifteen
    # minutes by BOOT_TIMEOUT_SECONDS in boot_test.py, so the cap covers two
    # timed-out boots plus a slow pull of this larger image.
    timeout-minutes: 60
    env:
      WORK: ${{ github.workspace }}/artifacts/boot-test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # bcvk's own CI host setup, run as its CI runs it. Without it virtiofsd
      # exits before any VM starts on this runner image ("Error entering
      # sandbox: DropSupplementalGroups ... Operation not permitted"), as
      # atomic-image-builder's variant boot test found. Pinned by commit and
      # run before anything else touches podman.
      - name: Prepare the host the way bcvk's CI does
        shell: bash
        env:
          BOOTC_ACTIONS_SHA: f77e18eca58220a5f8e82a115d65ee5973fcec83
          BOOTC_HOST_LIBVIRT: "true"
        run: |
          set -euo pipefail
          git clone -q https://github.com/bootc-dev/actions "${RUNNER_TEMP}/bootc-actions"
          git -C "${RUNNER_TEMP}/bootc-actions" checkout -q "${BOOTC_ACTIONS_SHA}"
          bash "${RUNNER_TEMP}/bootc-actions/bootc-host-setup/ci/install-deps.sh"
          bash "${RUNNER_TEMP}/bootc-actions/bootc-host-setup/ci/workarounds.sh"

      - name: Give the runner user KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install the VM stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils virtiofsd skopeo
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/bcvk.tar.gz" \
            https://github.com/bootc-dev/bcvk/releases/download/v0.19.0/bcvk-x86_64-unknown-linux-gnu.tar.gz
          echo "e6e3e2e8c13546d30481b035217442de78f2efe3e5a3bd3dbfb58d38345b4b98  ${RUNNER_TEMP}/bcvk.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/bcvk.tar.gz" -C "${RUNNER_TEMP}/bin" bcvk-x86_64-unknown-linux-gnu
          mv "${RUNNER_TEMP}/bin/bcvk-x86_64-unknown-linux-gnu" "${RUNNER_TEMP}/bin/bcvk"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      # The image is several GB compressed and more unpacked. The root
      # filesystem's free space varies between runners; /mnt, where it exists,
      # is the larger disk.
      - name: Put container storage on the larger disk
        shell: bash
        run: |
          set -euo pipefail
          df -h / /mnt 2>/dev/null || df -h /
          if [ -d /mnt ] && [ "$(df --output=avail -B1 /mnt | tail -1)" -gt "$(df --output=avail -B1 / | tail -1)" ]; then
            sudo mkdir -p /mnt/containers /mnt/tmp
            sudo chown "$(id -u):$(id -g)" /mnt/containers /mnt/tmp
            mkdir -p "${HOME}/.config/containers"
            printf '[storage]\ndriver = "overlay"\ngraphroot = "/mnt/containers/storage"\n' > "${HOME}/.config/containers/storage.conf"
            echo "TMPDIR=/mnt/tmp" >> "${GITHUB_ENV}"
          fi
          podman info --format '{{.Store.GraphRoot}}'

      - name: Boot the image and check ZFS
        shell: bash
        env:
          BOOT_TEST_IMAGE: ${{ inputs.image || 'ghcr.io/danathar/zfs-aurora-complex:latest' }}
          BOOT_TEST_WORK: ${{ env.WORK }}
        run: python3 -m ci_tools.cli boot-test

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-test-${{ github.run_id }}
          path: |
            ${{ env.WORK }}/result.json
            ${{ env.WORK }}/checks/
            ${{ env.WORK }}/boot-*/
          if-no-files-found: ignore
          retention-days: 30
