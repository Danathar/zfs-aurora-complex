---
name: Agent audit trail

# Reads back the record an agent-written pull request is supposed to leave,
# and fails when one did not leave it.
#
# The record is GitHub itself; docs/agent-tasks/README.md says where each part
# of it lives. A Hive pull request ends its description with a `— hive:`
# signature line naming the role, backend and model that wrote it, and every
# commit on it carries a Signed-off-by trailer. Nothing checked either once the
# merge was in: the only required status check in .github/rulesets/main.json
# is `Python Unit Tests`, and an omp-backed run pushes under the maintainer's
# own login, so the author alone cannot say which merged pull requests an
# agent wrote.
#
# The job lists the pull requests merged in a window and keeps the
# agent-written ones: opened by the Hive app or carrying the signature line.
# (This repository has no in-repo AI workflow, so no branch-name clause is
# needed; docs/SECURITY-AI.md names Hive as the one autonomous path.) It writes
# one row each to the run summary: merge date, author, who merged it, the signature,
# the issue it closes, how many commits carry a sign-off, and whether the
# labeler marked it `area/safety-critical` (Tier 3 in docs/risk-tiers.md).
#
# Two things fail the run, because each is checkable from what GitHub holds:
#
#   * a pull request the Hive app opened with no `— hive:` signature line;
#   * a commit on an agent pull request with no Signed-off-by trailer. A merge
#     commit is exempt when the pull request went into `main` and every parent
#     after the first is outside the commits the pull request lists: that is
#     what updating a branch from `main` writes, and what it brings in was
#     read when it reached `main`. A merge of another unmerged branch brings
#     in commits the pull request lists, so it still needs its trailer.
#
# Both rules apply to pull requests merged from 2026-10-08. Earlier ones that
# miss the record are still listed, under "Before enforcement", but do not
# fail the run, so a manual run over an older window does not turn red for
# history nobody can amend.
#
# Nothing else fails it. A missing `Closes #N`, who merged a pull request and
# a Tier 3 label are reported, not judged: docs/agent-tasks/README.md says a
# pull request without the line has no recorded task, and this repository has
# no second reviewer, so a self-merge rule would be red on every run.
#
# It is a check, not a metric. The metrics page keeps its numbers off a
# schedule on purpose; this runs monthly because its answer is red or green.
# It writes nothing but its own run summary: the token reads pull requests,
# nothing is checked out, and no action runs. Pull request text reaches the
# shell only as `gh` output read by `jq`, never through an Actions expression.

on:
  schedule:
    - cron: '23 5 1 * *'  # monthly, the 1st at 05:23 UTC, covering the previous 31 days
  workflow_dispatch:
    inputs:
      since:
        description: Audit pull requests merged on or after this date (YYYY-MM-DD). Blank means the last 31 days.
        required: false
        default: ''

concurrency:
  group: agent-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read back merged agent pull requests
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Audit merged agent pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail

          if [ -z "${SINCE}" ]; then
            SINCE="$(date -u -d '31 days ago' +%F)"
          fi
          case "${SINCE}" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *)
              echo "::error::since must be YYYY-MM-DD, got '${SINCE}'"
              exit 2
              ;;
          esac
          if [ "$(date -u -d "${SINCE}" +%F 2>/dev/null)" != "${SINCE}" ]; then
            echo "::error::since must be a real date, got '${SINCE}'"
            exit 2
          fi

          # `gh pr list` returns the newest N and says nothing about the rest,
          # so a window that fills the cap is refused rather than audited in
          # part.
          limit=500
          gh pr list --repo "${REPO}" --state merged --limit "${limit}" \
            --search "merged:>=${SINCE}" \
            --json number,title,author,baseRefName,headRefName,mergedAt,mergedBy,body,labels,url > merged.json
          total="$(jq length merged.json)"
          if [ "${total}" -ge "${limit}" ]; then
            echo "::error::${total} pull requests merged since ${SINCE} reached the ${limit} cap; audit a narrower window"
            exit 2
          fi

          # A signature counts only as the body's last non-blank line, in the
          # documented shape: `— hive: ` and then `key=value` fields. A body
          # that quotes the line in its text is not signed by it. Lines that
          # are wholly an HTML comment are skipped first: a reader never sees
          # them, and the Hive appends markers such as
          # `<!-- hive:issue-link-fixed -->` below the signature after the pull
          # request opens. The first field is not pinned to `agent=`: the
          # omp-backed runs sign `— hive: backend=omp model=...` with no role.
          # Both jq programs below read the signature through this one
          # definition.
          signature_def='def signature:
            (.body // "") | split("\n") | map(sub("\\s+$"; "")) | map(select(length > 0))
            | map(select(test("^\\s*<!--.*-->\\s*$") | not)) | (last // "")
            | if test("^— hive: [a-z_]+=") then . else null end;'

          # The Hive app's login as `gh` spells it. The signature clause is
          # what catches the omp-backed runs, which open pull requests under
          # the maintainer's login. Renovate is a bot but not an agent in this
          # sense, so the app is matched by login, not by is_bot.
          jq -c "${signature_def}"'
            [.[] | select(
                .author.login == "app/danathar-atomic-hive"
                or (signature != null))]' merged.json > agents.json

          # Commits and closing issues are fetched one pull request at a time:
          # asking `gh pr list` for them alongside the list trips GitHub's
          # GraphQL node ceiling on a busy window.
          jq -r '.[].number' agents.json | while read -r number; do
            gh pr view "${number}" --repo "${REPO}" --json number,commits,closingIssuesReferences
          done | jq -s 'map({(.number | tostring): .}) | add // {}' > details.json

          # `gh pr view` returns at most 100 commits. A pull request past that
          # would be audited in part and read as clean, so it is refused like
          # a window past the cap.
          partial="$(jq -r 'to_entries[] | select((.value.commits | length) >= 100) | "#\(.key)"' details.json | paste -sd, -)"
          if [ -n "${partial}" ]; then
            echo "::error::${partial} list 100 commits, the most the API returns; audit it by hand"
            exit 2
          fi

          # A merge commit is told apart by its parents, not its subject,
          # which anyone can write. `gh pr view` does not return parents, so
          # they are read, in order, for each commit that lacks a trailer and
          # no other. A lookup that returns anything but commit hashes fails
          # the run.
          jq -r '.[].commits[] | select(.messageBody | test("(^|\n)Signed-off-by: ") | not) | .oid' details.json | sort -u |
            while read -r oid; do
              printf '%s %s\n' "${oid}" "$(gh api "repos/${REPO}/commits/${oid}" --jq '[.parents[].sha] | join(",")')"
            done | jq -Rn '[inputs | split(" ") | {(.[0]): (.[1] | split(",")
                | if length > 0 and all(test("^[0-9a-f]{40}$")) then . else error("no parents read for \(.)") end)}]
                | add // {}' > parents.json

          # Merge dates before this day are reported, not failed (see header).
          enforce_from="2026-10-08"

          jq --arg since "${SINCE}" --arg enforce "${enforce_from}" --arg total "${total}" \
            --slurpfile details details.json --slurpfile parents parents.json "${signature_def}"'
            # The commits a pull request lists are what its branch held and
            # its base did not when it merged, so a parent missing from that
            # list was on the base then. Every parent after the first, which
            # is what the merge brought in, must be missing from it, and the
            # base must be `main`. So a merge of another unmerged branch still
            # needs its trailer, even as the first commit on the branch, when
            # the first parent is the `main` commit it started from; so does any
            # merge on a pull request into another branch, which nothing here
            # audits. Asking `main` would prove nothing: once the pull request
            # merges, every parent is on `main`.
            def ismerge($own; $base): ($parents[0][.oid] // []) as $p
              | $base == "main"
              and ($p | length) > 1
              and all($p[1:][]; IN($own[]) | not);
            def signed: .messageBody | test("(^|\n)Signed-off-by: ");
            def row:
              . as $pr
              | ($details[0][$pr.number | tostring]) as $d
              | if $d == null then error("no commits fetched for #\($pr.number)") else . end
              | [$d.commits[].oid] as $own
              | {
                  number: $pr.number,
                  url: $pr.url,
                  title: $pr.title,
                  merged: $pr.mergedAt[:10],
                  author: $pr.author.login,
                  merged_by: ($pr.mergedBy.login // "unknown"),
                  app: ($pr.author.login == "app/danathar-atomic-hive"),
                  enforced: ($pr.mergedAt[:10] >= $enforce),
                  signature: (signature | if . == null then null else ltrimstr("— hive: ") end),
                  closes: [$d.closingIssuesReferences[].number],
                  tier3: any($pr.labels[]; .name == "area/safety-critical"),
                  commits: ($d.commits | length),
                  merges: ([$d.commits[] | select(ismerge($own; $pr.baseRefName))] | length),
                  unsigned: [$d.commits[] | select(ismerge($own; $pr.baseRefName) | not) | select(signed | not) | .oid[:7]]
                };
            def findings:
              [ .[]
                | (if .app and .signature == null
                   then "#\(.number): opened by the Hive app with no `— hive:` signature line, so the role and model that wrote it are unrecorded"
                   else empty end),
                  (if (.unsigned | length) > 0
                   then "#\(.number): commit(s) \(.unsigned | join(", ")) carry no Signed-off-by trailer"
                   else empty end)
              ];
            def cell: tostring | gsub("\\|"; "\\|");
            def signoffs:
              (.commits - .merges) as $own
              | if (.unsigned | length) == 0
                then "all\(if .merges > 0 then " (\(.merges) merge exempt)" else "" end)"
                else "**\($own - (.unsigned | length)) of \($own)**" end;
            map(row) as $rows
            | ($rows | map(select(.enforced)) | findings) as $found
            | ($rows | map(select(.enforced | not)) | findings) as $history
            | {
                findings: $found,
                report: (
                  [ "### Agent audit trail: pull requests merged since \($since)",
                    "",
                    "\($rows | length) of the \($total) pull requests merged in the window were written by an agent.",
                    "" ]
                  + (if ($rows | length) == 0 then [] else
                      [ "| PR | Merged | Author | Merged by | Signature | Closes | Commits | Signed-off | Tier 3 |",
                        "| --- | --- | --- | --- | --- | --- | --- | --- | --- |" ]
                      + [ $rows[]
                          | "| [#\(.number)](\(.url)) \(.title | cell) | \(.merged) | \(.author) | \(.merged_by) | \(.signature // "**missing**" | cell) | \(if (.closes | length) == 0 then "none" else (.closes | map("#\(.)") | join(", ")) end) | \(.commits) | \(signoffs) | \(if .tier3 then "yes" else "no" end) |" ]
                      + [ "" ]
                    end)
                  + (if ($found | length) == 0
                     then [ "No finding among the agent pull requests merged on or after \($enforce)." ]
                     else [ "#### Findings", "" ] + ($found | map("- " + .))
                     end)
                  + (if ($history | length) == 0 then [] else
                      [ "", "#### Before enforcement (merged before \($enforce); reported, not failed)", "" ]
                      + ($history | map("- " + .))
                    end)
                  | join("\n")
                )
              }' agents.json > result.json

          jq -r .report result.json | tee -a "${GITHUB_STEP_SUMMARY}"
          findings="$(jq '.findings | length' result.json)"
          if [ "${findings}" -gt 0 ]; then
            echo "::error::${findings} finding(s) among the agent pull requests merged since ${SINCE}; see the run summary"
            exit 1
          fi
